# =============================================================================
# Spring Boot User Management API - Application Configuration
# =============================================================================

spring.application.name=springboot-user-management-api

# Server
server.port=8080
server.servlet.context-path=/api

# -----------------------------------------------------------------------------
# MySQL DataSource (update credentials for your environment)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JPA Auditing (createdAt / updatedAt)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------------
# SQL init - sample dummy data (see data.sql)
# -----------------------------------------------------------------------------
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# -----------------------------------------------------------------------------
# Jackson JSON
# -----------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.usermanagement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# -----------------------------------------------------------------------------
# Pagination defaults (documentation; enforced in controller)
# -----------------------------------------------------------------------------
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
